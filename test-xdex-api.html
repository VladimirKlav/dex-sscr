<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XDEX API Tester</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 30px;
    }
    h1 { color: #333; margin-bottom: 10px; }
    .subtitle { color: #666; margin-bottom: 30px; }

    .endpoint-group { margin-bottom: 30px; }
    .endpoint-group h2 { color: #667eea; margin-bottom: 15px; font-size: 18px; }

    .endpoint-item {
      background: #f8f9fa;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      border-left: 4px solid #ddd;
    }
    .endpoint-item.success { border-left-color: #28a745; background: #d4edda; }
    .endpoint-item.error { border-left-color: #dc3545; background: #f8d7da; }

    .endpoint-url { font-family: 'Courier New', monospace; font-size: 14px; color: #333; margin-bottom: 8px; }
    .endpoint-method {
      display: inline-block;
      padding: 2px 8px;
      background: #007bff;
      color: white;
      border-radius: 3px;
      font-size: 12px;
      margin-right: 10px;
    }
    .test-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .test-btn:hover { background: #5568d3; }

    .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
      margin-left: 10px;
    }
    .status.pending { background: #ffc107; color: #333; }
    .status.success { background: #28a745; color: white; }
    .status.error { background: #dc3545; color: white; }

    .result {
      margin-top: 10px;
      padding: 10px;
      background: white;
      border-radius: 5px;
      font-size: 12px;
      max-height: 220px;
      overflow: auto;
      display: none;
    }
    pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; }

    .test-all-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-bottom: 30px;
    }
    .test-all-btn:hover { background: #218838; }

    .config {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .config input {
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      min-width: 340px;
      font-family: "Courier New", monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 XDEX API Endpoint Tester</h1>
    <p class="subtitle">Test XDEX REST API endpoints to discover which ones work</p>

    <div class="config">
      <input id="apiBase" value="https://api.xdex.xyz/api/xendex" />
      <input id="network" value="X1 Mainnet" />
    </div>

    <button class="test-all-btn" onclick="testAllEndpoints()">🚀 Test All Endpoints</button>

    <div class="endpoint-group">
      <h2>📝 Token Endpoints</h2>
      <div id="tokens-endpoints"></div>
    </div>

    <div class="endpoint-group">
      <h2>💧 Pool/Pair Endpoints</h2>
      <div id="pools-endpoints"></div>
    </div>

    <div class="endpoint-group">
      <h2>📊 Statistics Endpoints</h2>
      <div id="stats-endpoints"></div>
    </div>

    <div class="endpoint-group">
      <h2>🔄 Swap Endpoints</h2>
      <div id="swap-endpoints"></div>
    </div>
  </div>

  <script>
    const endpoints = {
      tokens: [
        { method: 'GET', path: '/tokens', params: (net) => `?network=${encodeURIComponent(net)}` },
        { method: 'GET', path: '/token-list', params: (net) => `?network=${encodeURIComponent(net)}` },
        { method: 'GET', path: '/tokens/list', params: (net) => `?network=${encodeURIComponent(net)}` },
      ],
      pools: [
        { method: 'GET', path: '/pools', params: (net) => `?network=${encodeURIComponent(net)}` },
        { method: 'GET', path: '/pools/list', params: (net) => `?network=${encodeURIComponent(net)}` },
        { method: 'GET', path: '/pairs', params: (net) => `?network=${encodeURIComponent(net)}` },
      ],
      stats: [
        { method: 'GET', path: '/stats', params: (net) => `?network=${encodeURIComponent(net)}` },
        { method: 'GET', path: '/stats/24h', params: (net) => `?network=${encodeURIComponent(net)}` },
        { method: 'GET', path: '/statistics', params: (net) => `?network=${encodeURIComponent(net)}` },
      ],
      swap: [
        {
          method: 'POST',
          path: '/swap/prepare',
          params: () => '',
          body: (net) => ({
            network: net,
            wallet: '11111111111111111111111111111111',
            token_in: 'So11111111111111111111111111111111111111112',
            token_out: 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v',
            token_in_amount: 0.01,
            is_exact_amount_in: true
          })
        }
      ]
    };

    function getConfig() {
      return {
        API_BASE: document.getElementById('apiBase').value.trim(),
        NETWORK: document.getElementById('network').value.trim(),
      };
    }

    function renderEndpoint(group, endpoint, index) {
      const container = document.getElementById(`${group}-endpoints`);
      const item = document.createElement('div');
      item.className = 'endpoint-item';
      item.id = `endpoint-${group}-${index}`;

      item.innerHTML = `
        <div>
          <span class="endpoint-method">${endpoint.method}</span>
          <span class="endpoint-url">${endpoint.path}</span>
          <span class="status pending" id="status-${group}-${index}">Pending</span>
          <button class="test-btn" onclick="testEndpoint('${group}', ${index})">Test</button>
        </div>
        <div class="result" id="result-${group}-${index}"></div>
      `;

      container.appendChild(item);
    }

    async function testEndpoint(group, index) {
      const endpoint = endpoints[group][index];
      const statusEl = document.getElementById(`status-${group}-${index}`);
      const resultEl = document.getElementById(`result-${group}-${index}`);
      const itemEl = document.getElementById(`endpoint-${group}-${index}`);

      const { API_BASE, NETWORK } = getConfig();
      const url = `${API_BASE}${endpoint.path}${endpoint.params ? endpoint.params(NETWORK) : ''}`;

      statusEl.textContent = 'Testing...';
      statusEl.className = 'status pending';
      itemEl.className = 'endpoint-item';
      resultEl.style.display = 'none';
      resultEl.innerHTML = '';

      try {
        const options = {
          method: endpoint.method,
          headers: { 'Content-Type': 'application/json' },
        };

        if (endpoint.body) {
          options.body = JSON.stringify(endpoint.body(NETWORK));
        }

        const start = performance.now();
        const response = await fetch(url, options);
        const elapsed = Math.round(performance.now() - start);

        const raw = await response.text();

        let pretty = raw;
        try {
          pretty = JSON.stringify(JSON.parse(raw), null, 2);
        } catch {}

        if (response.ok) {
          statusEl.textContent = `✅ ${response.status} OK (${elapsed}ms)`;
          statusEl.className = 'status success';
          itemEl.className = 'endpoint-item success';
          resultEl.innerHTML = `<strong>URL:</strong> <pre>${url}</pre><br/><strong>Response:</strong><pre>${pretty}</pre>`;
        } else {
          statusEl.textContent = `❌ ${response.status} ${response.statusText} (${elapsed}ms)`;
          statusEl.className = 'status error';
          itemEl.className = 'endpoint-item error';
          resultEl.innerHTML = `<strong>URL:</strong> <pre>${url}</pre><br/><strong>Error:</strong><pre>${pretty || 'No response body'}</pre>`;
        }

        resultEl.style.display = 'block';
      } catch (error) {
        statusEl.textContent = `❌ Error`;
        statusEl.className = 'status error';
        itemEl.className = 'endpoint-item error';

        // This is where CORS shows up a lot:
        // "Failed to fetch" + console will say Access-Control-Allow-Origin missing.
        resultEl.innerHTML = `<strong>URL:</strong> <pre>${url}</pre><br/><strong>Error:</strong><pre>${error.message}</pre>`;
        resultEl.style.display = 'block';
      }
    }

    async function testAllEndpoints() {
      const groups = Object.keys(endpoints);
      for (const group of groups) {
        for (let i = 0; i < endpoints[group].length; i++) {
          await testEndpoint(group, i);
          await new Promise(resolve => setTimeout(resolve, 250));
        }
      }
    }

    window.onload = () => {
      Object.keys(endpoints).forEach(group => {
        endpoints[group].forEach((endpoint, index) => renderEndpoint(group, endpoint, index));
      });
    };
  </script>
</body>
</html>
